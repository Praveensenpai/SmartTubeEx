name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish Signed Stable APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Build Signing
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Signed Stable Release
        run: ./gradlew clean assembleStstableRelease

      - name: Generate Checksums
        run: |
          cd smarttubetv/build/outputs/apk/ststable/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK Signing
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT" -type f -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          # apksigner prints lowercase hex without colons; normalize both sides.
          EXPECTED="c07917bee9d6fe0eb3cf025ee5433afd447b64778f2b3e683a321b3bc702e35e"
          for apk in smarttubetv/build/outputs/apk/ststable/release/*.apk; do
            echo "== $(basename "$apk") =="
            CERTS=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$CERTS" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
            GOT=$(echo "$CERTS" | grep -i 'SHA-256 digest' | head -1 \
              | sed -E 's/.*digest:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
            if [ "$GOT" != "$EXPECTED" ]; then
              echo "ERROR: $(basename "$apk") signed with $GOT, expected $EXPECTED" >&2
              exit 1
            fi
          done
          echo "All APKs verified against release key $EXPECTED"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🌸 SmartTubeEx ${{ github.ref_name }} ✨"
          body_path: .github/RELEASE_NOTES.md
          files: |
            smarttubetv/build/outputs/apk/ststable/release/*.apk
            smarttubetv/build/outputs/apk/ststable/release/SHA256SUMS.txt
          fail_on_unmatched_files: true